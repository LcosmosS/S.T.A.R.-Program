name: S.T.A.R. CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            submodules: 'true'  # Enable submodule checkout
            fetch-depth: 0

        - name: Cache submodules
          uses: actions/cache@v4
          with:
            path: |
              data/ecdata
              data/eclib
              data/lmfdb
            key: submodules-${{ hashFiles('.gitmodules') }}
            restore-keys: submodules-

        - name: Generate small CI Cremona subset
          shell: bash -l {0}
          run: |
            mkdir -p data/raw results
            
            if [ -d "data/ecdata" ] && [ -n "$(ls -A data/ecdata 2>/dev/null)" ]; then
              echo "Using ecdata submodule..."
              python scripts/generate_cremona_subset.py --max-labels 1000 > data/raw/ci_subset.csv 2>&1
            else
              echo "WARNING: data/ecdata is empty - generating fallback test subset"
              # Create a simple test dataset for CI
              cat > data/raw/ci_subset.csv << 'EOF'
              label
              11a1
              37b1
              37b2
              431b1
              37b3
              389a1
              389b1
              389c1
              433a1
              433c1
              EOF
            fi

            # Verify the CSV file was created
            if [ -s data/raw/ci_subset.csv ]; then
              echo "✓ Subset file generated successfully"
              echo "Sample of generated subset:"
              head -5 data/raw/ci_subset.csv
            else
              echo "ERROR: ci_subset.csv is empty or was not created"
              exit 1
            fi
    
        - name: Setup Miniforge3
          uses: conda-incubator/setup-miniconda@v3
          with:
            auto-update-conda: true
            python-version: "3.12"
            environment-file: environment.yml
            activate-environment: star-env
            channels: conda-forge
            use-mamba: true
            conda-solver: libmamba

        - name: Install additional dependencies
          shell: bash -l {0}
          run: |
            conda install -y joblib

        - name: Add src to PYTHONPATH
          shell: bash -l {0}
          run: |
            echo "PYTHONPATH=${GITHUB_WORKSPACE}/src:${PYTHONPATH}" >> $GITHUB_ENV

        - name: Verify environment and submodules
          shell: bash -l {0}
          run: |
            echo "=== Python & Conda ==="
            python --version
            which python
            conda list | grep -E "sage|joblib|mamba|conda" || true
          
            echo "=== Submodules Status ==="
            ls -la data/ecdata data/eclib data/lmfdb || echo "Warning: Some submodules missing"
            git submodule status

        - name: Run tests
          shell: bash -l {0}
          run: pytest -q

        - name: Generate small CI Cremona subset
          shell: bash -l {0}
          run: |
            mkdir -p data/raw results
            if [ -d "data/ecdata" ] && [ -n "$(ls -A data/ecdata 2>/dev/null)" ]; then
              python scripts/generate_cremona_subset.py --max-labels 1000 > data/raw/ci_subset.csv
            else
              echo "WARNING: data/ecdata is empty - generating fallback subset"
            fi
            
            # Add CSV header
            if [ -s data/raw/ci_subset.csv ]; then
              echo "✓ Subset file generated"
            else
              echo "ERROR: ci_subset.csv is empty"
              exit 1
            fi

        - name: Build dataset on CI subset
          shell: bash -l {0}
          run: |
            if [ -f scripts/build_ec_dataset_parallel.sage ]; then
              sage -python scripts/build_ec_dataset_parallel.sage \
                --labels-file data/raw/ci_subset.csv \
                --output results/ci_ec_subset.csv \
                --workers 2 \
                --batch-size 10
            else
              echo "Dataset builder script not found - skipping"
            fi

        - name: Upload CI artifacts
          uses: actions/upload-artifact@v4
          with:
            name: ci-results
            path: results/
            retention-days: 7
