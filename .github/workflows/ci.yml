name: S.T.A.R. CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Cache submodules
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            data/ecdata
            data/eclib
            data/lmfdb
          key: submodules-${{ hashFiles('.gitmodules') }}
          restore-keys: submodules-

      - name: Initialize submodules or clone from GitHub
        shell: bash -l {0}
        run: |
          echo "Attempting to initialize submodules..."
          git submodule update --init --recursive --depth 1 2>/dev/null || {
            echo "Submodule initialization failed, attempting direct clone from GitHub..."
            
            if [ ! -d "data/ecdata" ] || [ -z "$(ls -A data/ecdata 2>/dev/null)" ]; then
              echo "Cloning JohnCremona/ecdata..."
              mkdir -p data/ecdata
              git clone --depth 1 https://github.com/JohnCremona/ecdata.git data/ecdata || true
            fi
            
            if [ ! -d "data/eclib" ] || [ -z "$(ls -A data/eclib 2>/dev/null)" ]; then
              echo "Cloning JohnCremona/eclib..."
              mkdir -p data/eclib
              git clone --depth 1 https://github.com/JohnCremona/eclib.git data/eclib || true
            fi
            
            if [ ! -d "data/lmfdb" ] || [ -z "$(ls -A data/lmfdb 2>/dev/null)" ]; then
              echo "Cloning LMFDB/lmfdb..."
              mkdir -p data/lmfdb
              git clone --depth 1 https://github.com/LMFDB/lmfdb.git data/lmfdb || true
            fi
          }
          echo "=== Submodule Status After Initialization ==="
          echo "ecdata: $([ -d data/ecdata ] && [ -n "$(ls -A data/ecdata)" ] && echo 'populated' || echo 'empty')"
          echo "eclib: $([ -d data/eclib ] && [ -n "$(ls -A data/eclib)" ] && echo 'populated' || echo 'empty')"
          echo "lmfdb: $([ -d data/lmfdb ] && [ -n "$(ls -A data/lmfdb)" ] && echo 'populated' || echo 'empty')"

      - name: Setup Miniforge3
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.12"
          environment-file: environment.yml
          activate-environment: star-env
          channels: conda-forge
          use-mamba: true

      - name: Install additional dependencies
        shell: bash -l {0}
        run: |
          conda install -y joblib

      - name: Add src to PYTHONPATH
        shell: bash -l {0}
        run: |
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/src:${PYTHONPATH}" >> $GITHUB_ENV

      - name: Verify environment
        shell: bash -l {0}
        run: |
          echo "=== Python & Conda ==="
          python --version
          which python
          conda list | grep -E "sage|joblib" || true

      - name: Run tests
        shell: bash -l {0}
        run: |
          pytest -q

      - name: Generate CI subset from ecdata submodule (Corrected)
        shell: bash -l {0}
        run: |
          mkdir -p data/raw results
          echo "=== Generating clean CI subset from ecdata (Corrected) ==="

          cat > generate_ci_subset.sage << 'EOF'
          from sage.all import *
          import csv
          import os

          print("Generating clean CI subset from ecdata submodule...")

          ecdata_path = "data/ecdata"
          labels = []

          # Target actual data files: alllabels, curves, curvedata, etc.
          print("Looking for label data files...")

          # Priority 1: alllabels file
          alllabels_file = os.path.join(ecdata_path, "alllabels")
          if os.path.exists(alllabels_file):
              print("Reading from alllabels file...")
              with open(alllabels_file) as f:
                  for line in f:
                      label = line.strip()
                      if label and not label.startswith('#') and len(label) > 3:
                          labels.append(label)
                      if len(labels) >= 800:
                          break

          # Priority 2: curves directory (most reliable)
          if len(labels) < 100:
              print("Falling back to curves directory...")
              curves_dir = os.path.join(ecdata_path, "curves")
              if os.path.exists(curves_dir):
                  for root, dirs, files in os.walk(curves_dir):
                      for file in files:
                          if file.endswith((".csv", ".txt")) and ("label" in file.lower() or file.startswith("a")):
                              base = file.split('.')[0]
                              if base and len(base) > 3 and base not in labels:
                                  labels.append(base)
                              if len(labels) >= 800:
                                  break
                      if len(labels) >= 800:
                          break

          print(f"Collected {len(labels)} labels.")

          # Final fallback if still empty
          if len(labels) == 0:
              print("WARNING: Using hardcoded fallback")
              labels = ["11a1","14a1","15a1","17a1","19a1","20a1","21a1","24a1","26a1","37a1","37b1","43a1"]

          # Write clean CSV
          with open("data/raw/ci_subset.csv", "w", newline="") as f:
              writer = csv.writer(f)
              writer.writerow(["label"])
              for label in labels:
                  writer.writerow([label])

          print("CI subset written successfully.")
          print("First 10 labels:", labels[:10])
          EOF

                    sage generate_ci_subset.sage

                    echo "=== Final ci_subset.csv Contents ==="
                    cat data/raw/ci_subset.csv
          
      - name: Commit CI Subset to Repository
        shell: bash -l {0}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f data/raw/ci_subset.csv ]; then
            git add data/raw/ci_subset.csv
            if git diff --staged --quiet; then
              echo "No changes to ci_subset.csv - skipping commit"
            else
              git commit -m "ci: update ci_subset.csv (auto-generated from ecdata)"
              git push || echo "Push skipped (may need permissions)"
              echo "Successfully committed and pushed updated ci_subset.csv"
            fi
          else
            echo "ERROR: ci_subset.csv was not generated!"
            exit 1
          fi

      - name: Build EC Dataset from Committed Subset
        shell: bash -l {0}
        run: |
          echo "=== Running dataset builder on committed subset ==="
          sage -python scripts/build_ec_dataset_parallel.sage \
            --labels-file data/raw/ci_subset.csv \
            --output results/ci_ec_subset.csv \
            --workers 2 \
            --batch-size 50

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-results
          path: results/
          retention-days: 7
