name: S.T.A.R. CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Cache large data directories
        id: cache-data
        uses: actions/cache@v4
        with:
          path: |
            data/ecdata
            data/eclib
            data/lmfdb
          key: ${{ runner.os }}-ecdata-${{ hashFiles('.gitmodules') }}
          restore-keys: |
            ${{ runner.os }}-ecdata-

      - name: Initialize submodules / fallback clones
        shell: bash -l {0}
        run: |
          echo "=== Submodule Initialization ==="
          git submodule update --init --recursive --depth 1 || true

          # Robust fallback clones
          mkdir -p data/raw results

          for repo in ecdata eclib lmfdb; do
            if [ ! -d "data/$repo" ] || [ -z "$(ls -A data/$repo 2>/dev/null)" ]; then
              echo "Cloning $repo as fallback..."
              git clone --depth 1 "https://github.com/${repo%%/*}/$repo.git" "data/$repo" || true
            fi
          done

          ls -la data/ || true

      - name: Setup Miniforge + Sage environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.12"
          environment-file: environment.yml
          activate-environment: star-env
          channels: conda-forge
          use-mamba: true

      - name: Install joblib + Sage extras
        shell: bash -l {0}
        run: |
          conda install -y joblib

      - name: Generate CI subset (sequential to avoid issues)
        shell: bash -l {0}
        run: |
          mkdir -p data/raw results
          
          if [ -d "data/ecdata" ] && [ -n "$(ls -A data/ecdata)" ]; then
            echo "✓ Using ecdata for subset..."
            python scripts/generate_cremona_subset.py --max-labels 500 > data/raw/ci_subset.csv || {
              echo "⚠ Falling back to hardcoded test subset"
              cat > data/raw/ci_subset.csv << EOF
          label
          11a1
          37b1
          37b2
          431b1
          389a1
          EOF
            }
          else
            echo "⚠ No ecdata - using minimal test subset"
            cat > data/raw/ci_subset.csv << EOF
          label
          11a1
          37b1
          37b2
          EOF
          fi

          echo "Subset sample:"
          head -5 data/raw/ci_subset.csv

      - name: Build EC Dataset (Sequential - FIXED)
        shell: bash -l {0}
        run: |
          if [ -f scripts/build_ec_dataset_parallel.sage ]; then
            echo "Running dataset build sequentially (no loky)..."
            sage -python scripts/build_ec_dataset_parallel.sage \
              --labels-file data/raw/ci_subset.csv \
              --output results/ci_ec_subset.csv \
              --workers 1 \          # Force 1 worker
              --batch-size 20
          else
            echo "Script not found - skipping"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-results
          path: results/
          retention-days: 7
