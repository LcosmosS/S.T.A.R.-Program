name: S.T.A.R. CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Miniconda + Environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.11"
          environment-file: environment.yml
          activate-environment: star-env
          channels: conda-forge
          miniforge-variant: Mambaforge
          use-mamba: true          # Much faster solver

      - name: Install editable package
        shell: bash -l {0}
        run: |
          conda activate star-env
          pip install -e ".[dev,tda]"

      - name: Run tests
        shell: bash -l {0}
        run: |
          conda activate star-env
          pytest -q --maxfail=5

  # Lightweight check to avoid kernel death
  check_light:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Miniconda (light)
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.11"
          environment-file: environment.yml
          activate-environment: star-env
          channels: conda-forge
          miniforge-variant: Mambaforge
          use-mamba: true

      - name: Run lightweight validation
        shell: bash -l {0}
        run: |
          conda activate star-env
          python -c "
          import sys
          print('Python version:', sys.version)
          import numpy, pandas, gudhi
          print('Core packages imported successfully')
          print('CI environment ready')
          "
          git push
