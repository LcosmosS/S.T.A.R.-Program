name: S.T.A.R. CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            submodules: 'true'  # Enable submodule checkout
            fetch-depth: 0

        - name: Cache submodules
          uses: actions/cache@v4
          with:
            path: |
              data/ecdata
              data/eclib
              data/lmfdb
            key: submodules-${{ hashFiles('.gitmodules') }}
            restore-keys: submodules-

        - name: Initialize submodules 
          if: steps.cache.outputs.cache-hit != 'true'
          shell: bash -l {0}
          run: |
            echo "Initializing submodules..."
            git submodule update --init --recursive --depth 1
            if [ ! -d "data/ecdata" ] || [ -z "$(ls -A data/ecdata 2>/dev/null)" ]; then
              echo "WARNING: Could not initialize data/ecdata"
              echo "Submodule details:"
              git submodule status
              echo "This may be a network or permission issue with external repositories"
            fi
    
        - name: Setup Miniforge3
          uses: conda-incubator/setup-miniconda@v3
          with:
            auto-update-conda: true
            python-version: "3.12"
            environment-file: environment.yml
            activate-environment: star-env
            channels: conda-forge
            use-mamba: true
            conda-solver: libmamba

        - name: Install additional dependencies
          shell: bash -l {0}
          run: |
            conda install -y joblib

        - name: Add src to PYTHONPATH
          shell: bash -l {0}
          run: |
            echo "PYTHONPATH=${GITHUB_WORKSPACE}/src:${PYTHONPATH}" >> $GITHUB_ENV

        - name: Verify environment and submodules
          shell: bash -l {0}
          run: |
            echo "=== Python & Conda ==="
            python --version
            which python
            conda list | grep -E "sage|joblib|mamba|conda" || true
          
            echo "=== Submodules Status ==="
            ls -la data/ecdata data/eclib data/lmfdb || echo "Warning: Some submodules missing"
            git submodule status

        - name: Run tests
          shell: bash -l {0}
          run: pytest -q

        - name: Generate small CI Cremona subset
          shell: bash -l {0}
          run: |
            mkdir -p data/raw results
            if [ -d "data/ecdata" ] && [ -n "$(ls -A data/ecdata 2>/dev/null)" ]; then
              python scripts/generate_cremona_subset.py --max-labels 1000 > data/raw/ci_subset.csv
            else
              echo "WARNING: data/ecdata is empty - generating fallback subset"
            fi
            
            # Add CSV header
            if [ -s data/raw/ci_subset.csv ]; then
              echo "✓ Subset file generated"
            else
              echo "ERROR: ci_subset.csv is empty"
              exit 1
            fi

        - name: Build dataset on CI subset
          shell: bash -l {0}
          run: |
            if [ -f scripts/build_ec_dataset_parallel.sage ]; then
              sage -python scripts/build_ec_dataset_parallel.sage \
                --labels-file data/raw/ci_subset.csv \
                --output results/ci_ec_subset.csv \
                --workers 2 \
                --batch-size 10
            else
              echo "Dataset builder script not found - skipping"
            fi

        - name: Upload CI artifacts
          uses: actions/upload-artifact@v4
          with:
            name: ci-results
            path: results/
            retention-days: 7
