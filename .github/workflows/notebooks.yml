name: Notebook Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    container:
      image: sagemath/sagemath:latest
      options: --user root --memory=8g

    steps:
      - name: Install system tools
        run: |
          apt-get update && apt-get install -y git pandoc texlive texlive-latex-extra texlive-xetex

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Cache heavy data
        uses: actions/cache@v4
        with:
          path: |
            data/ecdata
            data/raw
            data/processed
            examples/exports
          key: notebook-cache-${{ hashFiles('data/**', 'examples/**') }}
          restore-keys: notebook-cache-

      - name: Install Python dependencies
        run: |
          sage -python -m pip install --upgrade pip
          sage -python -m pip install --no-cache-dir numpy pandas tqdm plotly corner ripser persim nbconvert nbclient ipykernel nest_asyncio

      - name: Execute Notebooks Sequentially + Commit After Each
        run: |
          mkdir -p examples/exports results
          
          # Set correct git working directory
          REPO_ROOT="/__w/S.T.A.R.-Program/S.T.A.R.-Program"
          cd $REPO_ROOT

          echo "=== Starting sequential notebook execution ==="

          for nb in examples/*.ipynb; do
            base=$(basename "$nb" .ipynb)
            output="exports/${base}-executed.ipynb"
            
            echo "========================================"
            echo "→ Executing $nb"
            echo "========================================"

            # Execute notebook
            timeout 600s sage -python -m jupyter nbconvert \
              --to notebook \
              --execute "$nb" \
              --output "$output" \
              --ExecutePreprocessor.timeout=240 \
              --ExecutePreprocessor.kernel_name=python3 || \
              echo "$nb failed or timed out — continuing"

            # Memory clear
            echo "Clearing memory..."
            sage -python -c "
            import gc
            gc.collect()
            import os
            os.system('sync; echo 3 > /proc/sys/vm/drop_caches') || true
            " 2>/dev/null || true
            sleep 10

            # Commit with explicit git directory
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            
            GIT_DIR=$REPO_ROOT/.git git --git-dir=$REPO_ROOT/.git --work-tree=$REPO_ROOT add "$output"
            
            if GIT_DIR=$REPO_ROOT/.git git --git-dir=$REPO_ROOT/.git --work-tree=$REPO_ROOT diff --staged --quiet; then
              echo "No changes for $base"
            else
              GIT_DIR=$REPO_ROOT/.git git --git-dir=$REPO_ROOT/.git --work-tree=$REPO_ROOT commit -m "ci: update executed notebook ${base} [skip ci]" || true
              GIT_DIR=$REPO_ROOT/.git git --git-dir=$REPO_ROOT/.git --work-tree=$REPO_ROOT push || echo "Push skipped (may need permissions)"
              echo "Committed $base"
            fi
          done

          echo "=== All notebooks processed ==="

      - name: Export HTML and PDF
        run: |
          mkdir -p exports
          for nb in examples/*-executed.ipynb; do
            base=$(basename "$nb" .ipynb)
            sage -python -m jupyter nbconvert --to html "$nb" --output-dir exports --output "exports/${base}.html"
            sage -python -m jupyter nbconvert --to pdf  "$nb" --output-dir exports --output "exports/${base}.pdf"
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notebook-outputs
          path: |
            examples/exports/
            results/
          retention-days: 14
