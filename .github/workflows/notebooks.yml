name: Notebook Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    container:
      image: sagemath/sagemath:latest
      options: --user root --memory=4g

    steps:
      - name: Install Git inside container 
        run: |
          apt-get update
          apt-get install -y git
          git --version

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Debug paths
        run: |
          echo "PWD: $(pwd)"
          echo "Listing /__w:"
          ls -R /__w || true      

      - name: Install system tools
        run: |
          apt-get update
          apt-get install -y pandoc texlive texlive-latex-extra texlive-xetex

      - name: Install Python dependencies
        run: |
          sage -python -m pip install --upgrade pip
          sage -python -m pip install --no-cache-dir \
            numpy pandas tqdm plotly==5.18.0 corner ripser persim \
            nbconvert nbclient ipykernel nest_asyncio

      - name: Clear Python cache
        run: rm -rf __pycache__ */__pycache__ */*/__pycache__

      - name: Execute Notebooks Sequentially + Commit After Each
        run: |
          mkdir -p examples/exports results
          cd /__w/S.T.A.R.-Program/S.T.A.R.-Program   # Ensure correct working directory

          echo "=== Starting sequential notebook execution ==="

          for nb in examples/*.ipynb; do
            base=$(basename "$nb" .ipynb)
            output="examples/exports/${base}-executed.ipynb"
            
            echo "========================================"
            echo "→ Executing $nb"
            echo "========================================"

            # Execute notebook
            timeout 10000s sage -python -m jupyter nbconvert \
              --to notebook \
              --execute "$nb" \
              --output "$output" \
              --ExecutePreprocessor.timeout=10000 \
              --ExecutePreprocessor.kernel_name=python3 || \
              echo " $nb failed or timed out — continuing"

            # Aggressive memory clear
            echo "Clearing memory..."
            sage -python -c "
            import os
            os.system('sync; echo 3 > /proc/sys/vm/drop_caches') || true
            " 2>/dev/null || true
                        sleep 10

            # Commit immediately
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            
            git add "$output"
            if git diff --staged --quiet; then
              echo "No changes for $base"
            else
              git commit -m "ci: update executed notebook ${base} [skip ci]" || true
              git push || echo "Push skipped (may need permissions)"
              echo " Committed $base"
            fi
          done

          echo "=== All notebooks processed ==="
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notebook-outputs
          path: |
            examples/exports/
            results/
          retention-days: 14

      - name: Export HTML and PDF
        run: |
          mkdir -p exports
          for nb in examples/*-executed.ipynb; do
            base=$(basename "$nb" .ipynb)
            sage -python -m jupyter nbconvert --to html "$nb" --output-dir exports --output "${base}.html"
            sage -python -m jupyter nbconvert --to pdf  "$nb" --output-dir exports --output "${base}.pdf"
          done
