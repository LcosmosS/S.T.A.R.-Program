name: Notebook Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    container:
      image: sagemath/sagemath:latest
      options: --user root --memory=6g

    steps:
      - name: Install Git and system tools
        run: |
          apt-get update
          apt-get install -y git pandoc texlive texlive-latex-extra texlive-xetex

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Sage Environment
        run: |
          sage -python -m pip install --upgrade pip
          sage -python -m pip install --no-cache-dir \
            nbconvert nbclient ipykernel nest_asyncio tqdm plotly corner ripser persim

          # Register Sage kernel for Jupyter
          sage -python -m ipykernel install --user --name sage --display-name "SageMath"

      - name: Add src to PYTHONPATH
        run: |
          echo "PYTHONPATH=/__w/S.T.A.R.-Program/S.T.A.R.-Program/src:${PYTHONPATH}" >> $GITHUB_ENV

      - name: Execute All Notebooks and Commit Outputs
        run: |
          mkdir -p examples/exports
          echo "=== Executing all notebooks in examples/ ==="

          for nb in examples/*.ipynb; do
            base=$(basename "$nb" .ipynb)
            output="examples/exports/${base}-executed.ipynb"
            
            echo "→ Running $nb ..."
            
            # Run with reasonable timeouts
            timeout 420s sage -python -m jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.timeout=300 \
              --ExecutePreprocessor.kernel_name=sage \
              --output="$output" "$nb" || echo " $nb timed out or failed (continuing)"
          done

          echo "=== Notebook execution completed ==="

          # Fix git ownership and commit outputs
          git config --global --add safe.directory /__w/S.T.A.R.-Program/S.T.A.R.-Program
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add examples/exports/*.ipynb

          if git diff --staged --quiet; then
            echo "No changes to notebook outputs."
          else
            git commit -m "ci: update executed notebook outputs [skip ci]"
            git push || echo "Push skipped (may need permissions)"
            echo "Successfully committed executed notebooks to examples/exports/"
          fi
