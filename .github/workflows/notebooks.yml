name: Notebook Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    container:
      image: sagemath/sagemath:latest
      options: --user root --memory=4g

    steps:
      - name: Install Git inside container 
        run: |
          apt-get update
          apt-get install -y git
          git --version

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Debug paths
        run: |
          echo "PWD: $(pwd)"
          echo "Listing /__w:"
          ls -R /__w || true      

      - name: Install system tools
        run: |
          apt-get update
          apt-get install -y pandoc texlive texlive-latex-extra texlive-xetex

      - name: Install Python dependencies
        run: |
          sage -python -m pip install --upgrade pip
          sage -python -m pip install --no-cache-dir \
            numpy pandas tqdm plotly==5.18.0 corner ripser persim \
            nbconvert nbclient ipykernel nest_asyncio

      - name: Clear Python cache
        run: rm -rf __pycache__ */__pycache__ */*/__pycache__

      - name: Add src to PYTHONPATH
        run: |
          echo "PYTHONPATH=/__w/S.T.A.R.-Program/S.T.A.R.-Program/src:${PYTHONPATH}" >> $GITHUB_ENV

      - name: Execute All Notebooks and Commit Outputs
        run: |
          mkdir -p examples/exports
          echo "=== Executing all notebooks in examples/ ==="

          for nb in examples/*.ipynb; do
            base=$(basename "$nb" .ipynb)
            output="examples/exports/${base}-executed.ipynb"
            
            echo "→ Running $nb ..."
            
            # Use full Sage Python module path
            timeout 480s sage -python -m jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.timeout=360 \
              --ExecutePreprocessor.kernel_name=sage \
              --output="$output" "$nb" || echo " $nb timed out or failed (continuing)"
          done

          echo "=== Notebook execution completed ==="

          # Commit outputs
          git config --global --add safe.directory /__w/S.T.A.R.-Program/S.T.A.R.-Program
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add examples/exports/*.ipynb

          if git diff --staged --quiet; then
            echo "No changes to notebook outputs."
          else
            git commit -m "ci: update executed notebook outputs [skip ci]"
            git push || echo "Push skipped (may need permissions)"
            echo "Successfully committed executed notebooks to examples/exports/"
          fi

        env:
          JUPYTER_ENABLE_LAB: "yes"
          PYTHONUNBUFFERED: "1"

      - name: Export HTML and PDF
        run: |
          mkdir -p exports
          for nb in examples/*-executed.ipynb; do
            base=$(basename "$nb" .ipynb)
            sage -python -m jupyter nbconvert --to html "$nb" --output-dir exports --output "${base}.html"
            sage -python -m jupyter nbconvert --to pdf  "$nb" --output-dir exports --output "${base}.pdf"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: notebook-outputs
          path: |
            results/
            examples/*-executed.ipynb
            exports/
