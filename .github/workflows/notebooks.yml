name: Notebook Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    container:
      image: sagemath/sagemath:latest
      options: --user root --memory=4g
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install Git inside container 
        run: |
          apt-get update
          apt-get install -y git
          git --version

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Setup Miniforge3
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.12"
          environment-file: environment.yml
          activate-environment: star-env
          channels: conda-forge
          use-mamba: true

      - name: Debug paths
        run: |
          echo "PWD: $(pwd)"
          echo "Listing /__w:"
          ls -R /__w || true      

      - name: Install system tools
        run: |
          apt-get update
          apt-get install -y pandoc texlive texlive-latex-extra texlive-xetex

      - name: Install Python dependencies
        run: |
          sage -python -m pip install --upgrade pip
          sage -python -m pip install --no-cache-dir \
            numpy pandas tqdm plotly==5.18.0 corner ripser persim \
            nbconvert nbclient ipykernel nest_asyncio

      - name: Add src to PYTHONPATH
        shell: bash -l {0}
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}/src:${PYTHONPATH}" >> $GITHUB_ENV

      - name: Execute All Notebooks and Commit Outputs
        shell: bash -l {0}
        run: |
          mkdir -p examples/exports

          echo "=== Executing all notebooks in examples/ ==="

          for nb in examples/*.ipynb; do
            base=$(basename "$nb" .ipynb)
            output="examples/exports/${base}-executed.ipynb"
            
            echo "→ Running $nb ..."
            
            # Execute with timeout and continue on error
            timeout 300s jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.timeout=180 \
              --ExecutePreprocessor.kernel_name=sage \
              --output="$output" "$nb" || echo " $nb timed out or failed (continuing)"
          done

          echo "=== Notebook execution completed ==="

          # Commit executed notebooks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add examples/exports/*.ipynb

          if git diff --staged --quiet; then
            echo "No changes to notebook outputs."
          else
            git commit -m "ci: update executed notebook outputs [skip ci]"
            git push || echo "Push skipped (may need permissions)"
            echo " Successfully committed executed notebooks to examples/exports/"
          fi
