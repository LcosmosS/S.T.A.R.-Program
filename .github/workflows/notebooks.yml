name: Notebook Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    container:
      image: sagemath/sagemath:latest
      options: --user root --memory=8g
      
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install Git inside container 
        run: |
          apt-get update
          apt-get install -y git
          git --version

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Debug paths
        run: |
          echo "PWD: $(pwd)"
          echo "Listing /__w:"
          ls -R /__w || true      

      - name: Install system tools
        run: |
          apt-get update
          apt-get install -y pandoc texlive texlive-latex-extra texlive-xetex

      - name: Install Python dependencies
        run: |
          sage -python -m pip install --upgrade pip
          sage -python -m pip install --no-cache-dir \
            numpy pandas tqdm plotly==5.18.0 corner ripser persim \
            nbconvert nbclient ipykernel nest_asyncio

      - name: Cache heavy data
        uses: actions/cache@v4
        with:
          path: |
            data/ecdata
            data/raw
            data/processed
            examples/exports
          key: notebook-cache-${{ hashFiles('data/**', 'examples/**') }}
          restore-keys: notebook-cache-

      - name: Execute notebooks
        run: |
          mkdir -p results exports
          for nb in examples/*.ipynb; do
            echo "Running $nb"
            sage -python -m jupyter nbconvert \
              --to notebook \
              --execute "$nb" \
              --output "$(basename $nb .ipynb)-executed.ipynb" \
              --ExecutePreprocessor.timeout=7200 \
              --ExecutePreprocessor.kernel_name=python3
            # Clear memory between notebooks
            import gc
            gc.collect()
            import os
            os.system('sync; echo 3 > /proc/sys/vm/drop_caches') || true
            " 2>/dev/null || true
            sleep 10
          done
        env:
          JUPYTER_ENABLE_LAB: "yes"
          PYTHONUNBUFFERED: "1"

      - name: Commit CI Executed Notebooks to Repo
        shell: bash -l {0}
        run: |
          git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            
            GIT_DIR=$REPO_ROOT/.git git --git-dir=$REPO_ROOT/.git --work-tree=$REPO_ROOT add "$output"
            
            if GIT_DIR=$REPO_ROOT/.git git --git-dir=$REPO_ROOT/.git --work-tree=$REPO_ROOT diff --staged --quiet; then
              echo "No changes for $base"
            else
              GIT_DIR=$REPO_ROOT/.git git --git-dir=$REPO_ROOT/.git --work-tree=$REPO_ROOT commit -m "ci: update executed notebook ${base} [skip ci]" || true
              GIT_DIR=$REPO_ROOT/.git git --git-dir=$REPO_ROOT/.git --work-tree=$REPO_ROOT push || echo "Push skipped (may need permissions)"
              echo "Committed $base"
            fi
          done

          echo "=== All notebooks processed ==="

      - name: Export HTML and PDF
        run: |
          mkdir -p exports
          for nb in examples/*-executed.ipynb; do
            base=$(basename "$nb" .ipynb)
            sage -python -m jupyter nbconvert --to html "$nb" --output-dir exports --output "${base}.html"
            sage -python -m jupyter nbconvert --to pdf  "$nb" --output-dir exports --output "${base}.pdf"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: notebook-outputs
          path: |
            results/
            examples/*-executed.ipynb
            exports/
